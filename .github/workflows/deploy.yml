name: CI/CD Pipeline - Deploy to Oracle VPS

on:
  pull_request:
    branches:
      - deploy
    types: [closed]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - hotfix
          - rerun
        default: 'patch'
      build_architecture:
        description: 'Architecture to build'
        required: false
        type: choice
        options:
          - arm64-only
          - amd64-only
          - multi-arch
        default: 'arm64-only'
      test_only:
        # EX0034 (GD-3): run Build & Test on the chosen branch and stop there. No version
        # bump, no tag, no image, no deploy.
        description: 'Only build and test the selected branch (nothing is bumped or deployed)'
        required: false
        type: boolean
        default: false
env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_NAME_LOWER: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  # ============================================
  # Job 1: Version Management
  # ============================================
  version-bump:
    name: Update Version
    runs-on: ubuntu-latest
    if: |
      (github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch') &&
      github.event.inputs.test_only != 'true'
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      build_arch: ${{ steps.set-arch.outputs.arch }}
      # "owner/repo" in lowercase: image refs are ghcr.io/<lower_repo> (there's no separate
      # owner output anymore; it was always empty, see EX0034).
      lower_repo: ${{ steps.lower-repo.outputs.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Architecture Output
        id: set-arch
        env:
          INPUT_BUILD_ARCH: ${{ github.event.inputs.build_architecture || 'arm64-only' }}
        run: |
          # Use input if manual, otherwise default to arm64-only
          ARCH="$INPUT_BUILD_ARCH"
          echo "arch=$ARCH" >> $GITHUB_OUTPUT

      - name: Repository to lowercase
        id: lower-repo
        run: |
          echo "repository=${GITHUB_REPOSITORY@L}" >> $GITHUB_OUTPUT

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Rust Nightly
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          cache: false

      - name: Determine version type from PR
        id: determine-version
        # HFEX0001: the PR title/body are passed as environment variables, never pasted
        # into the script with ${{ }}. Pasted, a backtick or $( ) in a PR description
        # became a command that ran here (2026-11-22: `/ping` and `DISCORD_TOKEN` in a
        # description were run as commands and broke the deploy). As variables, bash
        # only ever reads them as text.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION_TYPE: ${{ github.event.inputs.version_type }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual dispatch - use the input
            VERSION_TYPE="$INPUT_VERSION_TYPE"
          else
            # PR merge - extract from PR title or body
            # Combine title and body for searching (case-insensitive)
            COMBINED=$(printf '%s %s' "$PR_TITLE" "$PR_BODY" | tr '[:upper:]' '[:lower:]')

            if [[ "$COMBINED" == *"[major]"* ]]; then
              VERSION_TYPE="major"
            elif [[ "$COMBINED" == *"[minor]"* ]]; then
              VERSION_TYPE="minor"
            elif [[ "$COMBINED" == *"[hotfix]"* ]]; then
              VERSION_TYPE="hotfix"
            elif [[ "$COMBINED" == *"[rerun]"* ]]; then
              VERSION_TYPE="rerun"
            else
              # Default to patch if no keyword found
              VERSION_TYPE="patch"
            fi
          fi

          echo "Detected version type: $VERSION_TYPE"
          echo "version_type=$VERSION_TYPE" >> $GITHUB_OUTPUT

      - name: Bump version in Cargo.toml
        id: bump
        run: |
          echo "Bumping version..."
          # Get current version from Cargo.toml
          CURRENT_VERSION=$(grep -m 1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Current version: $CURRENT_VERSION"

          # Use the determined version type
          VERSION_TYPE="${{ steps.determine-version.outputs.version_type }}"
          echo "Version type: $VERSION_TYPE"

          # For rerun, just use current version without changes
          if [ "$VERSION_TYPE" = "rerun" ]; then
            echo "Rerun mode - using existing version: $CURRENT_VERSION"
            echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Split version into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          
          # Bump version based on type
          case $VERSION_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch|hotfix)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          
          # Update Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml
          
          # Update Cargo.lock
          cargo update -p excelsior || cargo generate-lockfile
          
          # Commit changes
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to $NEW_VERSION [$VERSION_TYPE]" || echo "No changes to commit"
          git push origin deploy
          
          # Set output
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        if: ${{ github.event.inputs.version_type != 'rerun' }}
        run: |
          echo "Creating Git tag..."
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          git tag -a "v$NEW_VERSION" -m "Release version $NEW_VERSION"
          git push origin "v$NEW_VERSION"
          echo "Git tag created successfully!"

  # ============================================
  # Job 2: Build and Test
  # ============================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: version-bump
    # A normal run waits for the version bump; a test-only run (EX0034) has none.
    if: |
      always() &&
      (needs.version-bump.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.test_only == 'true'))

    # EX0034 (GD-3): the test database follows the repository variable DATABASE_KIND
    # ("mariadb", the default, or "postgres"; Settings > Secrets and variables > Actions >
    # Variables). The app's own migrations create everything at test start, the same way
    # as in production, so a broken migration fails this job and nothing is deployed.
    services:
      db:
        image: ${{ vars.DATABASE_KIND == 'postgres' && 'postgres:18' || 'mariadb:13.0' }}
        env:
          # Each image reads only its own variables and ignores the others.
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - ${{ vars.DATABASE_KIND == 'postgres' && '5432:5432' || '3306:3306' }}
        options: >-
          --health-cmd="${{ vars.DATABASE_KIND == 'postgres' && 'pg_isready -U postgres -d test_db' || 'healthcheck.sh --connect --innodb_initialized' }}"
          --health-interval=10s --health-timeout=5s --health-retries=10

      # Redis (bitnami image, since the official redis image has no way to require a
      # password via env vars - only via a command override, which GitHub Actions
      # service containers don't support)
      redis:
        image: bitnami/redis:latest
        env:
          REDIS_PASSWORD: test_redis_password
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli -a test_redis_password ping" --health-interval=10s --health-timeout=5s --health-retries=3

      # Add OpenTelemetry Collector
      otel-collector:
        image: otel/opentelemetry-collector:latest
        ports:
          - 4317:4317  # OTLP gRPC
          - 4318:4318  # OTLP HTTP

    steps:
      - name: Check DATABASE_KIND
        env:
          DATABASE_KIND: ${{ vars.DATABASE_KIND || 'mariadb' }}
        run: |
          case "$DATABASE_KIND" in
            mariadb|postgres) echo "Testing against: $DATABASE_KIND" ;;
            *) echo "Error: the DATABASE_KIND variable must be 'mariadb' or 'postgres' (got '$DATABASE_KIND')."; exit 1 ;;
          esac

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # A test-only run tests the branch it was started on; a deploy tests "deploy".
          ref: ${{ github.event.inputs.test_only == 'true' && github.ref || 'deploy' }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          cache: true
          components: clippy, rustfmt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      # No "set up test database" step: the tests apply the app's migrations themselves.

      - name: Run tests
        run: cargo test --verbose
        env:
          DATABASE_NAME: test_db
          DATABASE_HOST: ${{ secrets.DATABASE_HOST_TEST || '127.0.0.1' }}
          DATABASE_USER: ${{ vars.DATABASE_KIND == 'postgres' && 'postgres' || 'root' }}
          DATABASE_PSWD: test
          DATABASE_PORT: ${{ vars.DATABASE_KIND == 'postgres' && '5432' || '3306' }}
          MS_PORT: 3000
          EXTERNAL_SERVICE_URL: https://dummyjson.com/c/717c-17c6-48b0-b197
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT_TEST || '127.0.0.1:4317' }}
          OTEL_SERVICE_NAME: excelsior-test
          ENVIRONMENT: testing
          RUST_LOG: debug
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: test_redis_password

      - name: Run Clippy
        run: cargo clippy -- -D warnings

  # ============================================
  # Job 3A: Build AMD64 Docker Image
  # ============================================
  docker-build-amd64:
    name: Build Docker Image (AMD64)
    runs-on: ubuntu-latest
    needs: [version-bump, build-and-test]
    # CONDITIONAL: Only run if amd64-only or multi-arch
    if: |
      always() && 
      needs.build-and-test.result == 'success' &&
      (needs.version-bump.outputs.build_arch == 'amd64-only' || needs.version-bump.outputs.build_arch == 'multi-arch')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: deploy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version-bump.outputs.new_version }}-amd64
            type=raw,value=latest-amd64

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          platforms: linux/amd64
          build-args: |
            VERSION=${{ needs.version-bump.outputs.new_version }}

      - name: Image size analysis
        run: |
          echo "AMD64 Docker image built successfully!"

  # ============================================
  # Job 3B: Build ARM64 Docker Image (NATIVE)
  # ============================================
  docker-build-arm64:
    name: Build Docker Image (ARM64 - Native)
    runs-on: ubuntu-24.04-arm # NATIVE ARM64 RUNNER
    needs: [version-bump, build-and-test]
    # CONDITIONAL: Only run if arm64-only or multi-arch
    if: |
      always() && 
      needs.build-and-test.result == 'success' &&
      (needs.version-bump.outputs.build_arch == 'arm64-only' || needs.version-bump.outputs.build_arch == 'multi-arch')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: deploy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version-bump.outputs.new_version }}-arm64
            type=raw,value=latest-arm64

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          platforms: linux/arm64
          build-args: |
            VERSION=${{ needs.version-bump.outputs.new_version }}

      - name: Image size analysis
        run: |
          echo "ARM64 Docker image built successfully!"

  # ============================================
  # Job 3C: Create Multi-Arch Manifest
  # ============================================
  docker-manifest:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [version-bump, docker-build-amd64, docker-build-arm64]
    # CONDITIONAL: Only run for multi-arch builds
    if: |
      always() && 
      needs.version-bump.outputs.build_arch == 'multi-arch' &&
      (needs.docker-build-amd64.result == 'success' && needs.docker-build-arm64.result == 'success')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          echo "Creating multi-architecture manifest..."

          # GHCR sometimes answers 500 for a moment: try each registry call up to 3 times.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "Attempt ${attempt} failed, retrying in 10s..."
              sleep 10
            done
            echo "Giving up after 3 attempts."
            return 1
          }

          # Create manifest for version tag
          retry docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ needs.version-bump.outputs.lower_repo }}:${{ needs.version-bump.outputs.new_version }} \
            ${{ env.REGISTRY }}/${{ needs.version-bump.outputs.lower_repo }}:${{ needs.version-bump.outputs.new_version }}-amd64 \
            ${{ env.REGISTRY }}/${{ needs.version-bump.outputs.lower_repo }}:${{ needs.version-bump.outputs.new_version }}-arm64
          
          # Create manifest for latest tag
          retry docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ needs.version-bump.outputs.lower_repo }}:latest \
            ${{ env.REGISTRY }}/${{ needs.version-bump.outputs.lower_repo }}:latest-amd64 \
            ${{ env.REGISTRY }}/${{ needs.version-bump.outputs.lower_repo }}:latest-arm64
          
          echo "Multi-architecture manifest created successfully!"

  # ============================================
  # Job 3D: Tag Single-Arch as Latest
  # ============================================
  docker-tag-single-arch:
    name: Tag Single Architecture as Latest
    runs-on: ubuntu-latest
    needs: [version-bump, docker-build-amd64, docker-build-arm64]
    # 🔥 CONDITIONAL: Only run for single-arch builds
    if: |
      always() && 
      (needs.version-bump.outputs.build_arch == 'arm64-only' || needs.version-bump.outputs.build_arch == 'amd64-only') &&
      ((needs.docker-build-arm64.result == 'success' && needs.version-bump.outputs.build_arch == 'arm64-only') ||
       (needs.docker-build-amd64.result == 'success' && needs.version-bump.outputs.build_arch == 'amd64-only'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag single-arch image as latest
        run: |
          if [ "${{ needs.version-bump.outputs.build_arch }}" = "arm64-only" ]; then
            ARCH="arm64"
          else
            ARCH="amd64"
          fi
          
          echo "Tagging ${ARCH} image as 'latest'..."

          # GHCR sometimes answers 500 for a moment: try each registry call up to 3 times.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "Attempt ${attempt} failed, retrying in 10s..."
              sleep 10
            done
            echo "Giving up after 3 attempts."
            return 1
          }

          # Create alias tags without architecture suffix
          retry docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ needs.version-bump.outputs.lower_repo }}:${{ needs.version-bump.outputs.new_version }} \
            ${{ env.REGISTRY }}/${{ needs.version-bump.outputs.lower_repo }}:${{ needs.version-bump.outputs.new_version }}-${ARCH}
          
          retry docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ needs.version-bump.outputs.lower_repo }}:latest \
            ${{ env.REGISTRY }}/${{ needs.version-bump.outputs.lower_repo }}:latest-${ARCH}
          
          echo "Single-architecture (${ARCH}) tagged as 'latest' successfully!"

  # ============================================
  # Job 4: Deploy to Oracle VPS - for all id_rsa_ga, it should be only id_rsa
  #     environment should have the same name as the branch/secret name
  # ============================================
  deploy:
    name: Deploy to Oracle VPS
    runs-on: ubuntu-latest
    needs: [version-bump, docker-build-amd64, docker-build-arm64, docker-manifest, docker-tag-single-arch]
    # CONDITIONAL: Run after appropriate build jobs complete
    # Only when the final tags (version + latest) exist: a successful build alone isn't
    # enough, the deploy pulls the plain version tag (2026-11-13 outage: GHCR 500 on
    # the tag job, deploy ran anyway and found no image).
    if: |
      always() &&
      (needs.docker-manifest.result == 'success' ||
       needs.docker-tag-single-arch.result == 'success')
    environment: Deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: deploy

      - name: Check VPS_HOST secret
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "Error: VPS_HOST secret is not set."
            exit 1
          else
            echo "VPS_HOST secret set and ready to go!"
          fi

      # The app exits at start without a bot token. Failing here, before anything
      # touches the VPS, keeps the version that's running now alive.
      # Same reason as the Telegram check below: the app exits at start without it.
      - name: Check DISCORD_TOKEN secret
        run: |
          if [ -z "${{ secrets.DISCORD_TOKEN }}" ]; then
            echo "Error: DISCORD_TOKEN secret is not set (Settings > Environments > Deploy)."
            exit 1
          else
            echo "DISCORD_TOKEN secret set and ready to go!"
          fi

      - name: Check TELEGRAM_BOT_TOKEN secret
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "Error: TELEGRAM_BOT_TOKEN secret is not set (Settings > Environments > Deploy)."
            exit 1
          else
            echo "TELEGRAM_BOT_TOKEN secret set and ready to go!"
          fi

      # HFEX0003: Grafana's and Mongo's admin logins. Grafana and Mongo only read them when
      # their data is created, so a blank one would stick: fail here instead, before
      # anything on the VPS changes.
      - name: Check admin login secrets
        env:
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
        run: |
          missing=0
          for name in GRAFANA_ADMIN_USER GRAFANA_ADMIN_PASSWORD MONGO_INITDB_ROOT_USERNAME MONGO_INITDB_ROOT_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Error: $name secret is not set (Settings > Environments > Deploy)."
              missing=1
            fi
          done
          [ "$missing" = 0 ] && echo "Admin login secrets set and ready to go!"
          exit "$missing"

      - name: Setup SSH
        run: |
          echo "Setting up SSH..."
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa_ga
          chmod 600 ~/.ssh/id_rsa_ga
          
          # Verify key format
          head -n 1 ~/.ssh/id_rsa_ga
          
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts || echo "Warning: ssh-keyscan failed"
          # Test the connection
          ssh -i ~/.ssh/id_rsa_ga -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SSH connection established successfully!'" 2>&1 || {
              echo "SSH connection failed. Check VPS_SSH_KEY, VPS_USER, and VPS_HOST secrets."
              exit 1
          }
          echo "SSH setup complete!"

      - name: Copy docker-compose.prod.yml to VPS
        run: |
          scp -i ~/.ssh/id_rsa_ga -o StrictHostKeyChecking=no docker-compose.prod.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/app/docker-compose.yml

      # EX0034: the file is built HERE from environment variables, then copied with scp.
      # Before, the secrets were pasted into a heredoc inside the ssh command, so a value
      # with an "EOF" line (or a multi-line secret) could cut the script short.
      - name: Generate .env file on VPS from GitHub Secrets
        env:
          # Deploy (GD-1, GD-2): which image and which datastores.
          APP_IMAGE: ${{ env.REGISTRY }}/${{ needs.version-bump.outputs.lower_repo }}
          APP_VERSION: ${{ needs.version-bump.outputs.new_version }}
          # Repository variable; this default is what ExcelsiorFull runs today.
          COMPOSE_PROFILES: ${{ vars.COMPOSE_PROFILES || 'mariadb,redis,mongodb' }}
          MS_PORT: ${{ secrets.MS_PORT || '3000' }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PSWD: ${{ secrets.DATABASE_PSWD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          # GD-2: one multi-line secret with the app's extra variables (KEY=value lines).
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          echo "Generating .env file..."
          umask 077
          # printf, not a heredoc: values are written as plain text, never run.
          line() { printf '%s=%s\n' "$1" "$2"; }
          {
            echo "# ============================================"
            echo "# Production Environment - generated by GitHub Actions on every deploy"
            echo "# DO NOT EDIT MANUALLY"
            echo "# ============================================"
            echo
            echo "# Deploy"
            line APP_IMAGE "$APP_IMAGE"
            line APP_VERSION "$APP_VERSION"
            line COMPOSE_PROFILES "$COMPOSE_PROFILES"
            echo
            echo "# Application"
            line MS_PORT "$MS_PORT"
            line ENVIRONMENT production
            line RUST_LOG "info,excelsior=debug"
            line RUST_BACKTRACE 0
            echo
            echo "# Database"
            line DATABASE_NAME "$DATABASE_NAME"
            line DATABASE_HOST "$DATABASE_HOST"
            line DATABASE_USER "$DATABASE_USER"
            line DATABASE_PSWD "$DATABASE_PSWD"
            line DATABASE_PORT "$DATABASE_PORT"
            echo
            echo "# External Services"
            line EXTERNAL_SERVICE_URL "https://dummyjson.com/c/717c-17c6-48b0-b197"
            echo
            echo "# Grafana OpenTelemetry"
            line OTEL_EXPORTER_OTLP_ENDPOINT "$OTEL_EXPORTER_OTLP_ENDPOINT"
            line OTEL_SERVICE_NAME excelsior-prod
            echo
            echo "# Admin logins (HFEX0003): read only when Grafana's / Mongo's data is created"
            # Compose expands "$" inside .env values ("a$b" would become "a"), so "$" is
            # written as "$$". Only for these new values: the older ones are left as they
            # were, since a database may already have been created with them.
            line_literal() { line "$1" "${2//\$/\$\$}"; }
            line_literal GRAFANA_ADMIN_USER "$GRAFANA_ADMIN_USER"
            line_literal GRAFANA_ADMIN_PASSWORD "$GRAFANA_ADMIN_PASSWORD"
            line_literal MONGO_INITDB_ROOT_USERNAME "$MONGO_INITDB_ROOT_USERNAME"
            line_literal MONGO_INITDB_ROOT_PASSWORD "$MONGO_INITDB_ROOT_PASSWORD"
            echo
            echo "# Redis"
            line REDIS_HOST redis
            line REDIS_PORT 6379
            line REDIS_PASSWORD "$REDIS_PASSWORD"
            echo
            echo "# MongoDB"
            line MONGODB_HOST mongodb
            line MONGODB_PORT 27017
            echo
            echo "# Background workers"
            line WORKER_SHUTDOWN_TIMEOUT_SECS 8
            echo
            echo "# Telegram bot (the production bot, never the dev one: one token, one poller)"
            line TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
            echo
            echo "# Discord bot (the production bot, never the dev one). DISCORD_GUILD_ID is optional:"
            echo "# empty = slash commands registered globally."
            line DISCORD_TOKEN "$DISCORD_TOKEN"
            line DISCORD_GUILD_ID "$DISCORD_GUILD_ID"
            echo
            echo "# App-specific variables (APP_ENV secret)"
            # Windows line endings removed, in case the secret was pasted from a Windows editor.
            if [ -n "$APP_ENV" ]; then printf '%s\n' "$APP_ENV" | tr -d '\r'; fi
          } > app.env

          # Copy, then swap in one step, so the VPS never sees a half-written .env.
          scp -i ~/.ssh/id_rsa_ga -o StrictHostKeyChecking=no app.env ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/app/.env.new
          ssh -i ~/.ssh/id_rsa_ga -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'chmod 600 ~/app/.env.new && mv ~/app/.env.new ~/app/.env'
          rm -f app.env
          echo "Environment file generated successfully!"

      # (No "copy migration files" step anymore: the migrations are compiled into the app
      # binary by sqlx::migrate! and applied by the app itself at startup.)

      - name: Deploy to VPS
        run: |
          echo "Deploying to VPS..."
          ssh -i ~/.ssh/id_rsa_ga -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            # Stop at the first failing command (and make this whole step fail).
            set -e
            cd ~/app

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 1. Download every image first (the app at APP_VERSION from .env, plus the
            #    pinned databases). If any pull fails, we stop HERE: nothing was stopped
            #    yet, so the version running now stays up.
            docker compose pull

            # 2. Recreate only the containers that changed. No "docker compose down":
            #    unchanged services (databases) keep running, so less downtime.
            if ! docker compose up -d --remove-orphans; then
              echo "docker compose up failed:"
              docker compose ps
              docker compose logs --tail 50 app || true
              exit 1
            fi

            # 3. Make sure the app is really running, not restarting in a loop.
            echo "Waiting for services to start..."
            sleep 20
            docker compose ps
            if ! docker compose ps --status running --services | grep -qx app; then
              echo "app is not running after the deploy:"
              docker compose logs --tail 50 app || true
              exit 1
            fi

            # 4. Clean up images not used by any container for 72h.
            docker image prune -af --filter "until=72h"

            echo "Deployment completed successfully!"
          EOF
          echo "Deployment completed successfully!"

      - name: Health Check
        run: |
          sleep 15
          ssh -i ~/.ssh/id_rsa_ga -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "curl -f http://localhost:3000/ping || exit 1"
          echo "Health check passed!"

  # ============================================
  # Job 5: Notification
  # ============================================
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [version-bump, deploy]
    if: always()

    steps:
      - name: Deployment Success
        if: needs.deploy.result == 'success'
        run: |
          echo "Deployment successful!"
          echo "Version: ${{ needs.version-bump.outputs.new_version }}"
          echo "Architecture: ${{ needs.version-bump.outputs.build_arch }}"
          echo "Environment: Production (Oracle VPS)"
          echo "Status: Live and healthy"

      - name: Deployment Failed
        if: needs.deploy.result == 'failure'
        run: |
          echo "XX Deployment failed!"
          echo "Check the logs above for details."
          exit 1