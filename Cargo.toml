[package]
name = "excelsior"
version = "3.1.3"
edition = "2024"
rust-version = "1.92.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8.8" }
tower-http = { version = "0.6.8", features = ["trace", "compression-full", "limit", "timeout"] }
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12.19", features = ["json"] }
http = "1.3.1"
serial_test = "3.3.1"
# OpenTelemetry
opentelemetry = { version = "0.32.0", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "metrics", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["trace", "metrics", "logs", "grpc-tonic"] }
tracing-opentelemetry = "0.33.0"
# Used by many packs. They live here so two packs never add the same line, which would
# break the merged Cargo.toml (see "Writing a pack" in the README).
anyhow = "1.0.97"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
axum = { version = "0.8.8" }
tokio = { version = "1.0", features = ["full", "test-util"] }
# Used by many packs' tests (see the comment above).
mockall = "0.14"
httpmock = "0.8.0-alpha.1"
# InMemoryMetricExporter for the metrics tests; tests only, not in the app binary.
opentelemetry_sdk = { version = "0.32.1", features = ["testing"] }

# Packs add new sections ([profile.release], [features]...) below this line, never above:
# git keeps dependency lines and new sections apart only if they're added in different spots.
