[package]
name = "excelsior"
version = "3.0.0"
edition = "2024"
rust-version = "1.92.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8.8" }
tower-http = { version = "0.6.8", features = ["trace", "compression-full", "limit", "timeout"] }
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12.19", features = ["json"] }
http = "1.3.1"
serial_test = "3.3.1"
anyhow = "1.0.97"
tokio-util = "0.7"
# Shared by the packs built on background-tasks (telegram, discord): mockable traits.
# Kept here so those packs never add the same line (see "Writing a pack" in the README).
async-trait = "0.1"
# Discord: gateway = the live WebSocket, http = REST calls, model = the data types
twilight-gateway = "0.18"
twilight-http = "0.18"
twilight-model = "0.18"
twilight-util = { version = "0.18", features = ["builder"] }
# Twilight connects over TLS (rustls) but leaves the choice of crypto backend to the app.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
axum = { version = "0.8.8" }
tokio = { version = "1.0", features = ["full", "test-util"] }
mockall = "0.14"
serde_json = "1"
