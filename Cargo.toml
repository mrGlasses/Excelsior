[package]
name = "excelsior"
version = "3.1.5"
edition = "2024"
rust-version = "1.92.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8.8" }
tower-http = { version = "0.6.8", features = ["trace", "compression-full", "limit", "timeout"] }
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12.19", features = ["json"] }
http = "1.3.1"
serial_test = "3.3.1"
# Used by many packs. They live here so two packs never add the same line, which would
# break the merged Cargo.toml (see "Writing a pack" in the README).
anyhow = "1.0.97"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
axum = { version = "0.8.8" }
tokio = { version = "1.0", features = ["full", "test-util"] }
# Used by many packs' tests (see the comment above).
mockall = "0.14"
httpmock = "0.8.0-alpha.1"

# Packs add new sections ([profile.release], [features]...) below this line, never above:
# git keeps dependency lines and new sections apart only if they're added in different spots.

# ============================================
# Build Profiles Optimization
# ============================================
[profile.release]
opt-level = 3           # Maximum optimization
lto = "thin"            # Thin Link-Time Optimization (faster than "fat", good balance)
codegen-units = 16      # Balance between compile time and runtime performance
strip = true            # Strip symbols from binary (smaller size)
# No panic = "abort" (HFEX0004): it saved ~3.6 MB (9.2 vs 12.8 MB), but a panicking worker
# then killed the process at once (exit 134): no "worker failed" log, no clean shutdown of
# the other workers, no trace flush. With unwinding, the Workers manager catches it.
incremental = false     # Disable incremental compilation in release (better optimization)

# ============================================
# Fast CI Build Profile (Optional)
# Use with:  cargo build --profile release-fast
# ============================================
[profile.release-fast]
inherits = "release"
opt-level = 2           # Slightly less optimization (faster compilation)
lto = false             # Disable LTO for faster builds
codegen-units = 256     # More parallelism = faster compilation
strip = true            # Still strip symbols

# ============================================
# Dependency Optimization
# ============================================
# This section allows you to override optimization for specific dependencies
# Useful if some deps are slow to compile but don't need max optimization
[profile.release.package."*"]
opt-level = 3

# Example: Speed up sqlx compilation in CI (uncomment if needed)
# [profile.release.package. sqlx]
# opt-level = 2

# Example: Speed up OpenTelemetry deps (uncomment if needed)
# [profile.release.package.opentelemetry]
# opt-level = 2
# [profile.release.package.opentelemetry_sdk]
# opt-level = 2
# [profile.release.package.opentelemetry-otlp]
# opt-level = 2
